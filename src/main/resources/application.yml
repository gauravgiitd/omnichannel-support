spring:
  application:
    name: omnichannel-support-platform
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
  jackson:
    default-property-inclusion: non_null
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  datasource:
    url: jdbc:h2:mem:support;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

support:
  auth:
    agent:
      allowed-emails: ${AGENT_ALLOWED_EMAILS:}
      allowed-google-groups: ${AGENT_ALLOWED_GOOGLE_GROUPS:}
      workspace-admin-email: ${GOOGLE_WORKSPACE_ADMIN_EMAIL:}
      service-account-json-base64: ${GOOGLE_SERVICE_ACCOUNT_JSON_BASE64:}
  outbound-email:
    from-address: support@company.example
    from-display-name: Company Support
  system-identity:
    agent-reply-from-address: support@company.example
